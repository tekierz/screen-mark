  <rect x="38" y="60" width="52" height="3" rx="1.5" fill="#b9b3a5"/>
  <rect x="38" y="67" width="36" height="3" rx="1.5" fill="#b9b3a5"/>
  <!-- character cue (centered) -->
  <rect x="56" y="78" width="20" height="4" rx="2" fill="#c8792b"/>
  <!-- dialog block (indented) -->
  <rect x="48" y="88" width="36" height="3" rx="1.5" fill="#8a8578"/>
  <rect x="48" y="95" width="28" height="3" rx="1.5" fill="#8a8578"/>
